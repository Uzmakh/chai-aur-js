<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Js Events</title>
  </head>
  <body>
    <h1>Chai aur JavaScript</h1>
    <h3>Js Events</h3>
    <h4>setInterval()</h4>
    <h4>clearInterval()</h4>
    <button id="start">Start</button>
    <button id="stop">Stop</button>

    <script>
      // call back function
      // executes repeatedly
      //   Basic syntax
      //   setInterval(function () {
      //     console.log("Hitesh", Date());
      //   }, 6000);
      //   storing in variable
      const sayDate = function (str) {
        console.log("Hi " + "Hitesh", Date());
      };
      setInterval(sayDate, 3000, "Hi");

      //   storing in variable and stopping its repitition
      // creating reference of setInterval
      const stopRepetition = setInterval(sayDate, 6000, "Hi");
      clearInterval(stopRepetition);

      // use of start and stop buttons
      document.querySelector("#start").addEventListener("click", sayDate);
      console.log("Started");

      document.querySelector("#stop").addEventListener("click", function () {
        clearInterval(stopRepetition);
        console.log("Stopped");
      });
    </script>
  </body>
</html>
